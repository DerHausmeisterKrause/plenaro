name: CI

# One build and one small end-to-end smoke test per PR.
# No duplicate pipeline automatically triggered on main after merging.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject private DNS, embedded credentials and key material
        run: python3 tools/check_public_repository.py
      - name: Build backend and frontend
        run: |
          dotnet build src/Plenaro.Api/Plenaro.Api.csproj -c Release
          cd frontend
          npm install --no-audit --no-fund
          TZ=Europe/Berlin npm test
          npm run build
      - name: Znuny REST write contract (mocked; no real emails)
        run: dotnet run --project tools/znuny_contract_tests/ZnunyContractTests.csproj -c Release
      - name: Docker smoke test (health, setup, login)
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
          PLENARO_FAVORITES_BASE_DOMAIN: apps.example.org
        run: |
          set -euo pipefail
          mkdir -p secrets
          # Ephemeral CA for the backend's real HTTPS client trust store.
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=Plenaro-Root-CA-CI' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -keyout secrets/ci-ca.key -out ci-ca.crt >/dev/null 2>&1
          export PLENARO_TRUSTED_CA_FILE="$PWD/ci-ca.crt"
          trap 'docker compose down -v --remove-orphans || true' EXIT
          docker compose up -d --build --wait --wait-timeout 180 || { docker compose logs --no-color --tail=120 web database; exit 1; }
          API=http://127.0.0.1
          curl -fsS "$API/health/ready" | grep -q '"schema":"current"'
          curl -fsS "$API/api/v1/setup/status" | grep -q '"required":true'
          # Entra is optional and disabled by default: no Microsoft credentials in CI.
          curl -fsS "$API/api/v1/auth/entra/status" | grep -q '"enabled":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/graph/status")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/auth/entra/start")" = "404"

          # The native HTML proxy needs no Selenium, VNC, screencast or
          # separate Docker browser. Validate only backend CA trust here.
          docker compose exec -T web sh -c \
            'test -s /tmp/plenaro-ca-bundle.pem && grep -q "BEGIN CERTIFICATE" /tmp/plenaro-ca-bundle.pem'
          ! docker compose config --services | grep -qx 'znuny-browser'
          echo 'CI checkpoint: backend CA trust; no Chromium service in Compose'

          echo 'CI checkpoint: services healthy, starting initial setup'
          TOKEN=$(docker compose exec -T web dotnet Plenaro.Api.dll --setup-token | sed -n 's/^SETUP_TOKEN=//p' | tr -d '\r')
          test "${#TOKEN}" -eq 64
          COOKIE=$(mktemp)
          trap 'rm -f "$COOKIE"; docker compose down -v --remove-orphans || true' EXIT
          CSRF=$(curl -fsS -c "$COOKIE" -b "$COOKIE" "$API/api/v1/auth/csrf" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" -X POST "$API/api/v1/setup/complete" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "{\"code\":\"$TOKEN\",\"email\":\"admin@example.invalid\",\"displayName\":\"CI Admin\",\"password\":\"CiTestPassword123!\"}")" = "204"

          curl -fsS "$API/api/v1/setup/status" | grep -q '"required":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/admin/ping")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" -X POST "$API/api/v1/auth/login" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"email":"admin@example.invalid","password":"CiTestPassword123!"}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/ping" | grep -q '"admin":true'
          curl -fsS -b "$COOKIE" "$API/api/v1/graph/status" | grep -q '"enabled":false'
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/entra/" | grep -q '"enabled":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" "$API/api/v1/graph/calendar?start=2026-10-28T00%3A00%3A00Z&end=2026-10-29T00%3A00%3A00Z")" = "404"

          # A CSRF token is tied to the authenticated principal, refresh after login.
          CSRF=$(curl -fsS -c "$COOKIE" -b "$COOKIE" "$API/api/v1/auth/csrf" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo 'CI checkpoint: setup and admin login OK'
          bash tools/favorites_smoke.sh "$API" "$COOKIE" "$CSRF"
          # User management coverage in the existing Docker smoke test (no new job).
          ID=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$API/api/v1/admin/users/" -H "X-CSRF-TOKEN: $CSRF" \
            -H 'Content-Type: application/json' \
            -d '{"email":"user@example.invalid","displayName":"Test User","role":"User","password":"CiUserPassword123!","agentId":77,"candidateUserId":1}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          test -n "$ID"
          # User creation and authoritative Znuny approval happen in one transaction.
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/users/" | python3 -c 'import json,sys;u=next(x for x in json.load(sys.stdin) if x["email"]=="user@example.invalid");assert u["agentId"]==77'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/admin/users/" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"email":"duplicate-agent@example.invalid","displayName":"Must Roll Back","role":"User","password":"CiUserPassword123!","agentId":77}')" = "409"
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/users/" | python3 -c 'import json,sys;assert not any(u["email"]=="duplicate-agent@example.invalid" for u in json.load(sys.stdin))'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/admin/users/" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"email":"invalid-agent@example.invalid","displayName":"Invalid Agent","role":"User","password":"CiUserPassword123!","agentId":0}')" = "400"
          # Admin deletion: CSRF, exact confirmation, RBAC and business-data FKs.
          AID=$(curl -fsS -b "$COOKIE" "$API/api/v1/auth/me" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/admin/users/$AID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"admin@example.invalid"}')" = "409"
          DELETE_ID=$(curl -fsS -b "$COOKIE" -X POST "$API/api/v1/admin/users/" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"email":"delete-me@example.invalid","displayName":"Disposable","password":"CiUserPassword123!","role":"User","agentId":333,"candidateUserId":1}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/admin/users/$DELETE_ID" -H 'Content-Type: application/json' -d '{"confirmation":"delete-me@example.invalid"}')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/admin/users/$DELETE_ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"wrong@example.invalid"}')" = "400"
          # Simulate an existing Entra association: the provider ID must be reusable.
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "INSERT INTO \"AspNetUserLogins\"(\"LoginProvider\",\"ProviderKey\",\"ProviderDisplayName\",\"UserId\") VALUES('Entra','11111111-1111-1111-1111-111111111111:22222222-2222-2222-2222-222222222222','Test Entra','$DELETE_ID')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/admin/users/$DELETE_ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"delete-me@example.invalid"}')" = "204"
          # Regression: migration 0022 unblocks previously deleted SSO identities,
          # so the old provider key is not reserved by a deletion ban.
          test "$(docker compose exec -T database psql -U plenaro -d plenaro -Atqc "SELECT to_regclass('public.entra_deleted_identities') IS NULL" | tr -d '[:space:]')" = "t"
          test "$(docker compose exec -T database psql -U plenaro -d plenaro -Atqc "SELECT count(*) FROM \"AspNetUserLogins\" WHERE \"ProviderKey\"='11111111-1111-1111-1111-111111111111:22222222-2222-2222-2222-222222222222'" | tr -d '[:space:]')" = "0"
          NEW_USER_ID=$(curl -fsS -b "$COOKIE" -X POST "$API/api/v1/admin/users/" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"email":"recreated@example.invalid","displayName":"Recreated","password":"CiUserPassword123!","role":"User"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          test "$NEW_USER_ID" != "$DELETE_ID"
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "INSERT INTO \"AspNetUserLogins\"(\"LoginProvider\",\"ProviderKey\",\"ProviderDisplayName\",\"UserId\") VALUES('Entra','11111111-1111-1111-1111-111111111111:22222222-2222-2222-2222-222222222222','Test Entra','$NEW_USER_ID')"
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/users/" | python3 -c 'import json,sys;u=next(x for x in json.load(sys.stdin) if x["email"]=="recreated@example.invalid");assert u["agentId"] is None and u["candidateUserId"] is None and u["role"]=="User"'

          test "$(docker compose exec -T database psql -U plenaro -d plenaro -Atqc "SELECT count(*) FROM znuny_approved_agent_bindings WHERE user_id='$DELETE_ID'" | tr -d '[:space:]')" = "0"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/admin/users/$DELETE_ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"delete-me@example.invalid"}')" = "404"

          # Business data with RESTRICT FKs must survive: reject the deletion.
          OWNED_ID=$(curl -fsS -b "$COOKIE" -X POST "$API/api/v1/admin/users/" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"email":"has-tasks@example.invalid","displayName":"Has Tasks","password":"CiUserPassword123!","role":"User"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "INSERT INTO tasks(id,owner_user_id,title) VALUES('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','$OWNED_ID','Do not cascade business data')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/admin/users/$OWNED_ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"has-tasks@example.invalid"}')" = "409"
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/users/" | python3 -c 'import json,sys;assert any(u["email"]=="has-tasks@example.invalid" for u in json.load(sys.stdin))'
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "DELETE FROM tasks WHERE owner_user_id='$OWNED_ID'"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/admin/users/$OWNED_ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"has-tasks@example.invalid"}')" = "204"
          echo 'CI checkpoint: admin-only deletions, SSO re-registration eligibility and protected business records verified'
          echo 'CI checkpoint: user created with approved Znuny ID; conflict rollback verified'
          USER_COOKIE=$(mktemp)
          trap 'rm -f "$COOKIE" "$USER_COOKIE"; docker compose down -v --remove-orphans || true' EXIT
          USER_CSRF=$(curl -fsS -c "$USER_COOKIE" -b "$USER_COOKIE" "$API/api/v1/auth/csrf" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" \
            -X POST "$API/api/v1/auth/login" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' \
            -d '{"email":"user@example.invalid","password":"CiUserPassword123!"}')" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" "$API/api/v1/admin/users/")" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" -X DELETE "$API/api/v1/admin/users/$AID" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"admin@example.invalid"}')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" -X PUT "$API/api/v1/admin/users/$ID" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"displayName":"Hacked","role":"User","disabled":false,"agentId":42}')" = "403"
          USER_CSRF=$(curl -fsS -c "$USER_COOKIE" -b "$USER_COOKIE" "$API/api/v1/auth/csrf" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo 'CI checkpoint: standard user login and nonadmin guards verified'
          # Znuny Classic defaults: no secrets or connector traffic, server-admin isolation.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/znuny/server")" = "401"
          curl -fsS -b "$COOKIE" "$API/api/v1/znuny/server" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["apiUrl"]=="https://SERVER/nph-genericinterface.pl/Webservice/GenericTicketConnectorREST";assert (d["ticketSearchRoute"],d["ticketSearchMethod"],d["ticketSearchAuthMode"])==("/Ticket","GET","Session");assert (d["syncIntervalMinutes"],d["candidateSyncIntervalMinutes"],d["searchLimit"],d["articleLimit"])==(15,5,100,20);assert d["ticketUpdateRoute"]=="/Ticket/{TicketID}/Update" and d["agentListRoute"]=="/Ticket/Agent/List"'
          curl -fsS -b "$COOKIE" "$API/api/v1/znuny/me" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["username"]=="" and d["agentId"] is None and d["candidateUserId"] is None and d["passwordConfigured"] is False'
          SERVER_JSON=$(curl -fsS -b "$COOKIE" "$API/api/v1/znuny/server")
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" -X PUT "$API/api/v1/admin/znuny/server" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d "$SERVER_JSON")" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/server" -H 'Content-Type: application/json' -d "$SERVER_JSON")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/server" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$(echo "$SERVER_JSON" | python3 -c 'import sys,json;d=json.load(sys.stdin);d["apiUrl"]="http://127.0.0.1/private";print(json.dumps(d))')")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/server" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$(echo "$SERVER_JSON" | python3 -c 'import sys,json;d=json.load(sys.stdin);d["ticketSearchAuthMode"]="Direct";print(json.dumps(d))')")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/server" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$SERVER_JSON")" = "204"
          MY_ZNUNY='{"username":"ci-operator","candidateKeywords":"Plenaro","candidateExcludeKeywords":"spam","includeOwner":true,"includeResponsible":true,"notifyOnNewAssignedTickets":true,"notifyOnTicketChanges":true,"showAllCandidatePoolTickets":false}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/znuny/me" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$MY_ZNUNY")" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/znuny/me" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["username"]=="ci-operator" and d["agentId"] is None and d["candidateKeywords"]=="Plenaro"'
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/znuny/me" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["username"]=="" and d["agentId"]==77'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/znuny/password" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"password":"never-print"}')" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/znuny/connection-test" -H "X-CSRF-TOKEN: $CSRF")" = "503"
          echo 'CI checkpoint: user cannot modify Znuny personal agent ID'
          # Central Znuny: one shared cache, disabled by default, 365d bootstrap config.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/znuny/tickets/status")" = "401"
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/znuny/sync" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["enabled"] is False and d["initialLookbackDays"]==365 and d["deltaIntervalMinutes"]==15 and d["cachedTickets"]==0 and d["candidateDefaultAgentId"]==1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" "$API/api/v1/admin/znuny/sync")" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/sync" -H 'Content-Type: application/json' -d '{"enabled":true,"serviceUsername":"ci-service","initialLookbackDays":365,"deltaIntervalMinutes":15,"openIntervalMinutes":360,"maxRequestsPerCycle":200}')" = "400"
          CONFIG='{"enabled":false,"serviceUsername":"ci-service","initialLookbackDays":365,"deltaIntervalMinutes":15,"openIntervalMinutes":360,"maxRequestsPerCycle":200}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/sync" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$CONFIG")" = "204"
          curl -fsS -b "$COOKIE" -X POST "$API/api/v1/admin/znuny/sync/run" -H "X-CSRF-TOKEN: $CSRF" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["status"]=="disabled" and d["requests"]==0'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" -X POST "$API/api/v1/admin/znuny/sync/run" -H "X-CSRF-TOKEN: $USER_CSRF")" = "403"
          # Non-destructive bootstrap restart: 7 -> 365 days without cache loss.
          LOOKBACK_7='{"enabled":false,"serviceUsername":"ci-service","initialLookbackDays":7,"deltaIntervalMinutes":15,"openIntervalMinutes":360,"maxRequestsPerCycle":200}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/sync" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$LOOKBACK_7")" = "204"
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "UPDATE znuny_sync_control SET bootstrap_cursor=now()-interval '7 days',bootstrap_end=now(),bootstrap_finished_at=now(),delta_watermark='2026-01-01 00:00:00+00',last_delta_at='2026-01-02 00:00:00+00',source_api_url='https://existing.invalid/znuny' WHERE id=true"
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "INSERT INTO znuny_cached_tickets(ticket_id,title) VALUES('bootstrap-ci','Do not lose me')"
          RESTART_HTTP_0=$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/admin/znuny/sync/bootstrap/restart" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"WRONG"}')
          echo 'Znuny restart check RESTART_HTTP_0: ' "$RESTART_HTTP_0"
          test "$RESTART_HTTP_0" = "400"
          RESTART_HTTP_1=$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/admin/znuny/sync/bootstrap/restart" -H 'Content-Type: application/json' -d '{"confirmation":"ZNUNY ERSTIMPORT NEU STARTEN"}')
          echo 'Znuny restart check RESTART_HTTP_1: ' "$RESTART_HTTP_1"
          test "$RESTART_HTTP_1" = "400"
          RESTART_HTTP_2=$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" -X POST "$API/api/v1/admin/znuny/sync/bootstrap/restart" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"ZNUNY ERSTIMPORT NEU STARTEN"}')
          echo 'Znuny restart check RESTART_HTTP_2: ' "$RESTART_HTTP_2"
          test "$RESTART_HTTP_2" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/admin/znuny/sync" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$CONFIG")" = "204"
          curl -fsS -b "$COOKIE" -X POST "$API/api/v1/admin/znuny/sync/bootstrap/restart" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"confirmation":"ZNUNY ERSTIMPORT NEU STARTEN"}' | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["status"]=="disabled" and d["requests"]==0'
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/znuny/sync" | python3 -c 'import sys,json,datetime as dt;d=json.load(sys.stdin);assert d["initialLookbackDays"]==365 and d["bootstrapFinishedAt"] is None and d["bootstrapCursor"] and d["bootstrapEnd"];assert d["deltaWatermark"].startswith("2026-01-01") and d["lastDeltaAt"].startswith("2026-01-02");assert d["sourceApiUrl"]=="https://existing.invalid/znuny" and d["cachedTickets"]==1;assert 364.9<(dt.datetime.fromisoformat(d["bootstrapEnd"].replace("Z","+00:00"))-dt.datetime.fromisoformat(d["bootstrapCursor"].replace("Z","+00:00"))).total_seconds()/86400<365.1'
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "DELETE FROM znuny_cached_tickets WHERE ticket_id='bootstrap-ci'"
          # Restore the initial pre-test state; following integration checks use
          # their own cached tickets and permission bindings.
          docker compose exec -T database psql -U plenaro -d plenaro -v ON_ERROR_STOP=1 -c "UPDATE znuny_sync_control SET bootstrap_cursor=NULL,bootstrap_end=NULL,bootstrap_finished_at=NULL,delta_watermark=NULL,last_delta_at=NULL,source_api_url=NULL WHERE id=true"
