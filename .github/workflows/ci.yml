name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build API
        run: |
          dotnet restore src/Plenaro.Api/Plenaro.Api.csproj
          dotnet build src/Plenaro.Api/Plenaro.Api.csproj --configuration Release --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend dependencies, typecheck, tests and build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Check Compose syntax
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: docker compose config --quiet
      - name: Build and start Docker stack
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: HTTP smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl --fail --silent --show-error http://127.0.0.1:8080/tickets | grep -q 'id="root"'
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live | grep -q '"phase":2'
      - name: Verify schema, migration history and database persistence
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: |
          set -euo pipefail
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U plenaro -d plenaro -Atc "SELECT count(*) FROM schema_migrations" | grep -qx '2'
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U plenaro -d plenaro -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('tasks','task_segments','time_entries','system_settings')" | grep -qx '4'
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready | grep -q '"schema":"current"'
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U plenaro -d plenaro <<'SQL'
          INSERT INTO system_settings (setting_key, setting_value)
          VALUES ('_ci_persistence_probe', '{"persisted": true}'::jsonb);
          SQL
          docker compose restart database
          docker compose restart web
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready | grep -q '"schema":"current"'
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U plenaro -d plenaro -Atc "SELECT setting_value->>'persisted' FROM system_settings WHERE setting_key='_ci_persistence_probe'" | grep -qx 'true'
          docker compose exec -T database psql -v ON_ERROR_STOP=1 -U plenaro -d plenaro -Atc "SELECT count(*) FROM schema_migrations" | grep -qx '2'
      - name: Dump logs if failed
        if: failure()
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: docker compose down -v --remove-orphans
