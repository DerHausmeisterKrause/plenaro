          test "$(curl -fsS -b "$COOKIE" "$API/api/v1/settings/me" | python3 -c 'import json,sys; assert json.load(sys.stdin)["theme"]=="light"; print("ok")')" = "ok"
          USER_CSRF=$(curl -fsS -c "$USER_COOKIE" -b "$USER_COOKIE" "$API/api/v1/auth/csrf" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" -X PUT "$API/api/v1/settings/me" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"theme":"dark","weekStart":"sunday"}')" = "204"
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/settings/me" | grep -q '"theme":"dark"'
          curl -fsS -b "$COOKIE" "$API/api/v1/settings/me" | grep -q '"theme":"light"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" -X PUT "$API/api/v1/settings/global" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"instanceName":"Unauthorized","supportEmail":"","defaultWeekStart":"sunday"}')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" -X PUT "$API/api/v1/settings/global" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"instanceName":"Plenaro CI","supportEmail":"support@example.invalid","defaultWeekStart":"sunday"}')" = "204"
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/settings/global" | grep -q '"instanceName":"Plenaro CI"'
          docker compose restart web
          docker compose up -d --wait --wait-timeout 120
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/settings/me" | grep -q '"theme":"dark"'
          curl -fsS -b "$COOKIE" "$API/api/v1/settings/global" | grep -q '"instanceName":"Plenaro CI"'
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/" | grep -q '"Bearbeitet"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -X DELETE "$API/api/v1/tasks/$TASK_ID" -H "X-CSRF-TOKEN: $CSRF")" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -X PUT "$API/api/v1/admin/users/$ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"displayName":"Test User","role":"User","disabled":true}')" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" "$API/api/v1/auth/me")" = "401"

          # NGINX HTTP is the default; web itself has NO exposed 8080 port.
          curl -fsS "http://127.0.0.1/health/ready" | grep -q '"schema":"current"'
          if curl -fsS --max-time 3 http://127.0.0.1:8080/health/live; then
            echo "ASP.NET must not be published on 8080"; exit 1
          fi

          # Same CI job, now switch to HTTPS with an explicit certificate/key from env.
          mkdir -p secrets
          openssl rand -hex 32 > secrets/vault.key
          chmod 0644 secrets/vault.key   # CI-only file, see docs for production permissions.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=plenaro.test' -addext 'subjectAltName=DNS:plenaro.test' \
            -keyout ci-tls.key -out ci-tls.crt
          export PLENARO_HTTPS_ENABLED=true
          export PLENARO_SERVER_NAME=plenaro.test
          export PLENARO_TLS_CERT_PATH="$PWD/ci-tls.crt"
          export PLENARO_TLS_KEY_PATH="$PWD/ci-tls.key"
          export PLENARO_VAULT_KEY_FILE=/run/plenaro-secrets/vault.key
          docker compose config --quiet
          docker compose up -d --force-recreate --wait --wait-timeout 180

          # HTTP redirects; the TLS connection validates the self-signed test certificate.
          HEADERS=$(curl -sSI -H 'Host: plenaro.test' http://127.0.0.1/health/ready)
          echo "$HEADERS" | grep -q '301 Moved Permanently'
          echo "$HEADERS" | grep -qi 'location: https://plenaro.test/health/ready'
          secure() { curl -fsS --cacert ./ci-tls.crt --resolve plenaro.test:443:127.0.0.1 "$@"; }
          HTTPS=https://plenaro.test
          secure "$HTTPS/health/ready" | grep -q '"schema":"current"'
          JAR=$(mktemp)
          trap 'rm -f "$COOKIE" "$USER_COOKIE" "$JAR"; docker compose down -v --remove-orphans || true' EXIT
          T=$(secure -c "$JAR" -b "$JAR" "$HTTPS/api/v1/auth/csrf" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          secure -c "$JAR" -b "$JAR" -D ./ci-headers -o /dev/null \
            -X POST "$HTTPS/api/v1/auth/login" -H "X-CSRF-TOKEN: $T" \
            -H 'Content-Type: application/json' -d '{"email":"admin@example.invalid","password":"CiTestPassword123!"}'
          grep -i '^set-cookie: Plenaro.Session=.*secure' ci-headers
          T=$(secure -c "$JAR" -b "$JAR" "$HTTPS/api/v1/auth/csrf" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          # Native HTML proxy uses only the existing HTTPS listener.
          secure -b "$JAR" "$HTTPS/api/v1/znuny/native/status" |
            python3 -c 'import json,sys;assert json.load(sys.stdin)["enabled"] is False'
          ! docker compose config --services | grep -qx 'znuny-browser'
          # Znuny personal password uses AES-GCM, never exposed by any settings GET.
          secure -b "$JAR" "$HTTPS/api/v1/znuny/me" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["vaultReady"] is True and d["passwordConfigured"] is False'
          secure -c "$JAR" -b "$JAR" -X PUT "$HTTPS/api/v1/znuny/password" -H "X-CSRF-TOKEN: $T" -H 'Content-Type: application/json' -d '{"password":"CI_ZNUNY_ONLY_DO_NOT_LOG"}' > /dev/null
          secure -b "$JAR" "$HTTPS/api/v1/znuny/me" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["passwordConfigured"] and "password" not in d and d["username"]=="ci-operator"'
          docker compose exec -T database psql -U plenaro -d plenaro -Atc "SELECT ciphertext <> convert_to('CI_ZNUNY_ONLY_DO_NOT_LOG','UTF8') FROM encrypted_secrets WHERE secret_name='znuny.password'" | grep -qx 't'
          test "$(secure -b "$JAR" -o /dev/null -w '%{http_code}' -X POST "$HTTPS/api/v1/znuny/connection-test")" = "400"
          curl -sS --cacert ./ci-tls.crt --resolve plenaro.test:443:127.0.0.1 \
            -b "$JAR" -X POST "$HTTPS/api/v1/znuny/connection-test" -H "X-CSRF-TOKEN: $T" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);assert "server" in d["error"].lower()'
          secure -c "$JAR" -b "$JAR" -X DELETE "$HTTPS/api/v1/znuny/password" -H "X-CSRF-TOKEN: $T" > /dev/null
          secure -b "$JAR" "$HTTPS/api/v1/znuny/me" | python3 -c 'import json,sys;assert not json.load(sys.stdin)["passwordConfigured"]'
          # Global technical Znuny credentials are encrypted, not per-user sync.
          secure -c "$JAR" -b "$JAR" -X PUT "$HTTPS/api/v1/admin/znuny/sync/password" -H "X-CSRF-TOKEN: $T" -H 'Content-Type: application/json' -d '{"password":"CI_GLOBAL_ZNUNY_SECRET"}' > /dev/null
          secure -b "$JAR" "$HTTPS/api/v1/admin/znuny/sync" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["passwordConfigured"] and "CI_GLOBAL_ZNUNY_SECRET" not in str(d)'
          docker compose exec -T database psql -U plenaro -d plenaro -Atc "SELECT ciphertext <> convert_to('CI_GLOBAL_ZNUNY_SECRET','UTF8') FROM encrypted_secrets WHERE scope='global' AND secret_name='znuny.sync.password'" | grep -qx 't'
          secure -c "$JAR" -b "$JAR" -X DELETE "$HTTPS/api/v1/admin/znuny/sync/password" -H "X-CSRF-TOKEN: $T" > /dev/null
          # Entra admin configuration is encrypted in Vault, never sourced from .env.
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | grep -q '"vaultReady":true'
          test "$(secure -b "$JAR" -w '%{http_code}' -o /dev/null -X PUT "$HTTPS/api/v1/admin/entra/" -H 'Content-Type: application/json' -d '{"tenantId":"11111111-1111-1111-1111-111111111111","clientId":"22222222-2222-2222-2222-222222222222","clientSecret":"CiOnlyDummySecretValue123!"}')" = "400"
          secure -c "$JAR" -b "$JAR" -X PUT "$HTTPS/api/v1/admin/entra/" -H "X-CSRF-TOKEN: $T" -H 'Content-Type: application/json' -d '{"tenantId":"11111111-1111-1111-1111-111111111111","clientId":"22222222-2222-2222-2222-222222222222","clientSecret":"CiOnlyDummySecretValue123!"}'
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["enabled"] and d["tenantId"]=="11111111-1111-1111-1111-111111111111" and "clientSecret" not in d'
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | grep -vq "CiOnlyDummySecretValue123!"
          secure -c "$JAR" -b "$JAR" -X DELETE "$HTTPS/api/v1/admin/entra/" -H "X-CSRF-TOKEN: $T"
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | grep -q '"enabled":false'
          secure -c "$JAR" -b "$JAR" -X PUT "$HTTPS/api/v1/admin/secrets/ci.token" \
            -H "X-CSRF-TOKEN: $T" -H 'Content-Type: application/json' \
            -d '{"value":"CI_VALUE_ONLY"}'
          secure -b "$JAR" "$HTTPS/api/v1/admin/secrets/" | grep -q '"ci.token"'
          docker compose exec -T database psql -U plenaro -d plenaro -Atc \
            "SELECT ciphertext <> convert_to('CI_VALUE_ONLY', 'UTF8') FROM encrypted_secrets WHERE secret_name='ci.token'" | grep -qx 't'
