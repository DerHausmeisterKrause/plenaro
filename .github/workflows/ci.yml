name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build API
        run: |
          dotnet restore src/Plenaro.Api/Plenaro.Api.csproj
          dotnet build src/Plenaro.Api/Plenaro.Api.csproj --configuration Release --no-restore
      - name: Check Compose syntax
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: docker compose config --quiet
      - name: Build and start Docker stack
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: HTTP smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "Plenaro 2.0"
      - name: Dump logs if failed
        if: failure()
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: docker compose down -v --remove-orphans
