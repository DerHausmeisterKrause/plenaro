name: CI

# One build and one small end-to-end smoke test per PR.
# No duplicate pipeline automatically triggered on main after merging.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend and frontend
        run: |
          dotnet build src/Plenaro.Api/Plenaro.Api.csproj -c Release
          cd frontend
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Docker smoke test (health, setup, login)
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: |
          set -euo pipefail
          mkdir -p secrets
          trap 'docker compose down -v --remove-orphans || true' EXIT
          docker compose up -d --build --wait --wait-timeout 180 || { docker compose logs --no-color --tail=120 web database; exit 1; }
          API=http://127.0.0.1
          curl -fsS "$API/health/ready" | grep -q '"schema":"current"'
          curl -fsS "$API/api/v1/setup/status" | grep -q '"required":true'
          # Entra is optional and disabled by default: no Microsoft credentials in CI.
          curl -fsS "$API/api/v1/auth/entra/status" | grep -q '"enabled":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/graph/status")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/auth/entra/start")" = "404"

          TOKEN=$(docker compose exec -T web dotnet Plenaro.Api.dll --setup-token | sed -n 's/^SETUP_TOKEN=//p' | tr -d '\r')
          test "${#TOKEN}" -eq 64
          COOKIE=$(mktemp)
          trap 'rm -f "$COOKIE"; docker compose down -v --remove-orphans || true' EXIT
          CSRF=$(curl -fsS -c "$COOKIE" -b "$COOKIE" "$API/api/v1/auth/csrf" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" -X POST "$API/api/v1/setup/complete" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "{\"code\":\"$TOKEN\",\"email\":\"admin@example.invalid\",\"displayName\":\"CI Admin\",\"password\":\"CiTestPassword123!\"}")" = "204"

          curl -fsS "$API/api/v1/setup/status" | grep -q '"required":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/admin/ping")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" -X POST "$API/api/v1/auth/login" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"email":"admin@example.invalid","password":"CiTestPassword123!"}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/ping" | grep -q '"admin":true'
          curl -fsS -b "$COOKIE" "$API/api/v1/graph/status" | grep -q '"enabled":false'
          curl -fsS -b "$COOKIE" "$API/api/v1/admin/entra/" | grep -q '"enabled":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" "$API/api/v1/graph/calendar?start=2026-10-28T00%3A00%3A00Z&end=2026-10-29T00%3A00%3A00Z")" = "404"

          # A CSRF token is tied to the authenticated principal, refresh after login.
          CSRF=$(curl -fsS -c "$COOKIE" -b "$COOKIE" "$API/api/v1/auth/csrf" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          # User management coverage in the existing Docker smoke test (no new job).
          ID=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$API/api/v1/admin/users/" -H "X-CSRF-TOKEN: $CSRF" \
            -H 'Content-Type: application/json' \
            -d '{"email":"user@example.invalid","displayName":"Test User","role":"User","password":"CiUserPassword123!"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          test -n "$ID"
          USER_COOKIE=$(mktemp)
          trap 'rm -f "$COOKIE" "$USER_COOKIE"; docker compose down -v --remove-orphans || true' EXIT
          USER_CSRF=$(curl -fsS -c "$USER_COOKIE" -b "$USER_COOKIE" "$API/api/v1/auth/csrf" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" \
            -X POST "$API/api/v1/auth/login" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' \
            -d '{"email":"user@example.invalid","password":"CiUserPassword123!"}')" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" "$API/api/v1/admin/users/")" = "403"
          USER_CSRF=$(curl -fsS -c "$USER_COOKIE" -b "$USER_COOKIE" "$API/api/v1/auth/csrf" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          # Phase 2 functional core: task CRUD, status transition and per-user isolation.
          TASK_ID=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$API/api/v1/tasks/" \
            -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"title":"CI Aufgabe","description":"Nur eigener Benutzer","status":"planned","priority":2,"tags":["ci","task"],"plannedFor":"2026-10-28"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          test -n "$TASK_ID"
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/" | grep -q '"CI Aufgabe"'
          test "$(curl -fsS -b "$USER_COOKIE" "$API/api/v1/tasks/" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')" = "0"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" \
            -X POST "$API/api/v1/tasks/$TASK_ID/status" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"status":"completed"}')" = "404"
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/today?date=2026-10-28" | grep -q '"CI Aufgabe"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -X POST "$API/api/v1/tasks/$TASK_ID/status" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"status":"completed"}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/?status=completed" | grep -q '"CI Aufgabe"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -X POST "$API/api/v1/tasks/$TASK_ID/status" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"status":"planned"}')" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -X PUT "$API/api/v1/tasks/$TASK_ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"title":"Bearbeitet","description":"","status":"active","priority":1,"tags":["tag"],"plannedFor":"2026-10-28"}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/" | grep -q '"Bearbeitet"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" \
            -X DELETE "$API/api/v1/tasks/$TASK_ID" -H "X-CSRF-TOKEN: $USER_CSRF")" = "404"
          # Task data survives the database/web restart later in this same test.
          # Task-bound timer and segment integration, no attendance or break tracking.
          WORK_ID=$(curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/" \
            -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"title":"Zeittest","description":"","status":"planned","priority":3,"tags":[],"plannedFor":"2026-10-29"}' \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          test -n "$WORK_ID"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/time/start")" = "400"
          curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/time/start" \
            -H "X-CSRF-TOKEN: $CSRF" | python3 -c 'import json,sys; assert json.load(sys.stdin)["runningSince"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/time/start" -H "X-CSRF-TOKEN: $CSRF")" = "409"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/time/stop" -H "X-CSRF-TOKEN: $USER_CSRF")" = "404"
          curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/time/stop" \
            -H "X-CSRF-TOKEN: $CSRF" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["runningSince"] is None and d["sessionCount"]==1 and d["bookedSeconds"]>=1'
          curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/time/adjust" \
            -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"deltaMinutes":30,"note":"Nachtrag"}' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["adjustedMinutes"]==30 and d["bookedSeconds"]>=1800'
          curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/time/adjust" \
            -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"deltaMinutes":-15}' | python3 -c 'import json,sys;d=json.load(sys.stdin); assert d["adjustedMinutes"]==15'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" "$API/api/v1/tasks/$WORK_ID/time")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/segments" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"startsAt":"2026-10-29T10:00:00Z","endsAt":"2026-10-29T09:00:00Z","note":"","participants":[]}')" = "400"
          SEG_ID=$(curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/$WORK_ID/segments" \
            -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"startsAt":"2026-10-29T09:00:00Z","endsAt":"2026-10-29T09:30:00Z","note":"Testsegment","participants":["kunde@example.invalid"]}' \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          test -n "$SEG_ID"
          curl -fsS -b "$COOKIE" "$API/api/v1/segments/availability?start=2026-10-29T09:00:00Z&end=2026-10-29T09:30:00Z&excludeId=$SEG_ID" | python3 -c 'import json,sys;assert json.load(sys.stdin)["available"]'

          curl -fsS -b "$USER_COOKIE" "$API/api/v1/segments/availability?start=2026-10-29T09:05:00Z&end=2026-10-29T09:20:00Z" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["available"] and not d["conflicts"]'

          curl -fsS -b "$COOKIE" "$API/api/v1/segments/availability?start=2026-10-29T09:05:00Z&end=2026-10-29T09:20:00Z" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert not d["available"] and len(d["conflicts"])==1'

          curl -fsS -b "$COOKIE" "$API/api/v1/segments/?start=2026-10-29T00%3A00%3A00Z&end=2026-10-30T00%3A00%3A00Z" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d)==1 and d[0]["note"]=="Testsegment" and d[0]["participants"]==["kunde@example.invalid"]'
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/segments/?start=2026-10-29T00%3A00%3A00Z&end=2026-10-30T00%3A00%3A00Z" | python3 -c 'import json,sys; assert json.load(sys.stdin)==[]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" "$API/api/v1/tasks/$WORK_ID/segments")" = "404"
          # Reschedule endpoint: only owned segment, CSRF checked, conflict on stale date.
          SCHEDULE_URL="$API/api/v1/tasks/$WORK_ID/segments/$SEG_ID/schedule"
          SCHEDULE_JSON='{"startsAt":"2026-10-30T11:00:00Z","endsAt":"2026-10-30T11:30:00Z","expectedStartsAt":"2026-10-29T09:00:00Z","expectedEndsAt":"2026-10-29T09:30:00Z"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" -X PATCH "$SCHEDULE_URL" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d "$SCHEDULE_JSON")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PATCH "$SCHEDULE_URL" -H 'Content-Type: application/json' -d "$SCHEDULE_JSON")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PATCH "$SCHEDULE_URL" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$SCHEDULE_JSON")" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/$WORK_ID/segments" | python3 -c 'import json,sys;s=json.load(sys.stdin)[0];assert s["note"]=="Testsegment" and s["participants"]==["kunde@example.invalid"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PATCH "$SCHEDULE_URL" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d "$SCHEDULE_JSON")" = "409"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/tasks/$WORK_ID/segments/$SEG_ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"startsAt":"2026-10-29T10:00:00Z","endsAt":"2026-10-29T11:00:00Z","note":"Verschoben","participants":[]}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/$WORK_ID/segments" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d)==1 and d[0]["note"]=="Verschoben"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/tasks/$WORK_ID/segments/$SEG_ID" -H "X-CSRF-TOKEN: $CSRF")" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/$WORK_ID/segments" | python3 -c 'import json,sys; assert json.load(sys.stdin)==[]'
          # Calendar schedule-only API: the removed segment must be inaccessible.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PATCH "$API/api/v1/tasks/$WORK_ID/segments/$SEG_ID/schedule" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"startsAt":"2026-10-30T11:00:00Z","endsAt":"2026-10-30T11:30:00Z","expectedStartsAt":"2026-10-29T09:00:00Z","expectedEndsAt":"2026-10-29T09:30:00Z"}')" = "404"
          # Availability API: unauthenticated reads are rejected; users see only their bookings.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/segments/availability?start=2026-11-02T09:00:00Z&end=2026-11-02T09:30:00Z")" = "401"
          curl -fsS -b "$COOKIE" "$API/api/v1/segments/availability?start=2026-11-02T09:00:00Z&end=2026-11-02T09:30:00Z" | python3 -c 'import json,sys; assert json.load(sys.stdin)["available"]'
          # Task activity reports: own data only, invalid month and CSV injection protection.
          MONTH=$(TZ=Europe/Berlin date +%Y-%m)
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/reports/month?month=$MONTH")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" "$API/api/v1/reports/month?month=2026-13")" = "400"
          curl -fsS -b "$COOKIE" "$API/api/v1/reports/month?month=$MONTH" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert any(r["title"]=="Zeittest" and r["adjustmentMinutes"]==15 and r["sessionCount"]>=1 and r["totalSeconds"]>=900 for r in d["tasks"])'
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/reports/month?month=$MONTH" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert all(r["title"]!="Zeittest" for r in d["tasks"])'
          # A task title resembling an Excel formula must become inert text.
          CSV_ID=$(curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/" -H "X-CSRF-TOKEN: $CSRF"             -H 'Content-Type: application/json' -d '{"title":"=1+1","description":"","status":"planned","priority":3,"tags":[]}'             | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          curl -fsS -b "$COOKIE" -X POST "$API/api/v1/tasks/$CSV_ID/time/adjust"             -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json'             -d '{"deltaMinutes":5,"note":"CSV"}' > /dev/null
          curl -fsS -b "$COOKIE" "$API/api/v1/reports/month.csv?month=$MONTH" | python3 -c 'import sys; s=sys.stdin.buffer.read().decode("utf-8-sig"); assert "\"\x27=1+1\"" in s and "SUMME" in s'
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/reports/month.csv?month=$MONTH" | python3 -c 'import sys;assert b"=1+1" not in sys.stdin.buffer.read()'
          # Day-marker quota smoke: annual UL, monthly BR, CSRF and user isolation.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/day-markers/budget")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/day-markers/budget" -H 'Content-Type: application/json' -d '{"annualUlDays":2,"monthlyBrDays":1}')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/day-markers/budget" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"annualUlDays":2,"monthlyBrDays":1}')" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/day-markers/2026-10-28" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"dayType":"UL","isBr":true}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/day-markers/summary?year=2026&month=10" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["usedUlDays"]==1 and d["usedBrDays"]==1 and d["brExhausted"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/day-markers/2026-10-28" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"dayType":"UL","isBr":true,"isHo":true}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/day-markers/?year=2026&month=10" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d[0]["isHo"] == True'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/day-markers/2026-10-30" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"dayType":"Normal","isBr":false,"isHo":true}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/day-markers/?year=2026&month=10" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(t["day"]=="2026-10-30" and t["isHo"] and t["dayType"]=="Normal" for t in d)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/day-markers/2026-10-29" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"dayType":"UL","isBr":false}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/day-markers/summary?year=2026&month=10" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["remainingUlDays"]==0 and d["ulExhausted"]'
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/day-markers/summary?year=2026&month=10" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["usedUlDays"]==0 and d["usedBrDays"]==0'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X PUT "$API/api/v1/day-markers/2026-10-28" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"dayType":"AM","isBr":false}')" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/day-markers/summary?year=2026&month=10" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["usedUlDays"]==1 and d["usedBrDays"]==0 and not d["brExhausted"]'
          # One focused settings test: access control, account separation and persistence.
          test "$(curl -fsS -b "$COOKIE" "$API/api/v1/settings/me" | python3 -c 'import json,sys; assert json.load(sys.stdin)["theme"]=="light"; print("ok")')" = "ok"
          USER_CSRF=$(curl -fsS -c "$USER_COOKIE" -b "$USER_COOKIE" "$API/api/v1/auth/csrf" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" -X PUT "$API/api/v1/settings/me" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"theme":"dark","weekStart":"sunday"}')" = "204"
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/settings/me" | grep -q '"theme":"dark"'
          curl -fsS -b "$COOKIE" "$API/api/v1/settings/me" | grep -q '"theme":"light"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$USER_COOKIE" -b "$USER_COOKIE" -X PUT "$API/api/v1/settings/global" -H "X-CSRF-TOKEN: $USER_CSRF" -H 'Content-Type: application/json' -d '{"instanceName":"Unauthorized","supportEmail":"","defaultWeekStart":"sunday"}')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" -X PUT "$API/api/v1/settings/global" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' -d '{"instanceName":"Plenaro CI","supportEmail":"support@example.invalid","defaultWeekStart":"sunday"}')" = "204"
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/settings/global" | grep -q '"instanceName":"Plenaro CI"'
          docker compose restart web
          docker compose up -d --wait --wait-timeout 120
          curl -fsS -b "$USER_COOKIE" "$API/api/v1/settings/me" | grep -q '"theme":"dark"'
          curl -fsS -b "$COOKIE" "$API/api/v1/settings/global" | grep -q '"instanceName":"Plenaro CI"'
          curl -fsS -b "$COOKIE" "$API/api/v1/tasks/" | grep -q '"Bearbeitet"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -X DELETE "$API/api/v1/tasks/$TASK_ID" -H "X-CSRF-TOKEN: $CSRF")" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -X PUT "$API/api/v1/admin/users/$ID" -H "X-CSRF-TOKEN: $CSRF" -H 'Content-Type: application/json' \
            -d '{"displayName":"Test User","role":"User","disabled":true}')" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$USER_COOKIE" "$API/api/v1/auth/me")" = "401"

          # NGINX HTTP is the default; web itself has NO exposed 8080 port.
          curl -fsS "http://127.0.0.1/health/ready" | grep -q '"schema":"current"'
          if curl -fsS --max-time 3 http://127.0.0.1:8080/health/live; then
            echo "ASP.NET must not be published on 8080"; exit 1
          fi

          # Same CI job, now switch to HTTPS with an explicit certificate/key from env.
          mkdir -p secrets
          openssl rand -hex 32 > secrets/vault.key
          chmod 0644 secrets/vault.key   # CI-only file, see docs for production permissions.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=plenaro.test' -addext 'subjectAltName=DNS:plenaro.test' \
            -keyout ci-tls.key -out ci-tls.crt
          export PLENARO_HTTPS_ENABLED=true
          export PLENARO_SERVER_NAME=plenaro.test
          export PLENARO_TLS_CERT_PATH="$PWD/ci-tls.crt"
          export PLENARO_TLS_KEY_PATH="$PWD/ci-tls.key"
          export PLENARO_VAULT_KEY_FILE=/run/plenaro-secrets/vault.key
          docker compose config --quiet
          docker compose up -d --force-recreate --wait --wait-timeout 180

          # HTTP redirects; the TLS connection validates the self-signed test certificate.
          HEADERS=$(curl -sSI -H 'Host: plenaro.test' http://127.0.0.1/health/ready)
          echo "$HEADERS" | grep -q '301 Moved Permanently'
          echo "$HEADERS" | grep -qi 'location: https://plenaro.test/health/ready'
          secure() { curl -fsS --cacert ./ci-tls.crt --resolve plenaro.test:443:127.0.0.1 "$@"; }
          HTTPS=https://plenaro.test
          secure "$HTTPS/health/ready" | grep -q '"schema":"current"'
          JAR=$(mktemp)
          trap 'rm -f "$COOKIE" "$USER_COOKIE" "$JAR"; docker compose down -v --remove-orphans || true' EXIT
          T=$(secure -c "$JAR" -b "$JAR" "$HTTPS/api/v1/auth/csrf" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          secure -c "$JAR" -b "$JAR" -D ./ci-headers -o /dev/null \
            -X POST "$HTTPS/api/v1/auth/login" -H "X-CSRF-TOKEN: $T" \
            -H 'Content-Type: application/json' -d '{"email":"admin@example.invalid","password":"CiTestPassword123!"}'
          grep -i '^set-cookie: Plenaro.Session=.*secure' ci-headers
          T=$(secure -c "$JAR" -b "$JAR" "$HTTPS/api/v1/auth/csrf" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          # Entra admin configuration is encrypted in Vault, never sourced from .env.
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | grep -q '"vaultReady":true'
          test "$(secure -b "$JAR" -w '%{http_code}' -o /dev/null -X PUT "$HTTPS/api/v1/admin/entra/" -H 'Content-Type: application/json' -d '{"tenantId":"11111111-1111-1111-1111-111111111111","clientId":"22222222-2222-2222-2222-222222222222","clientSecret":"CiOnlyDummySecretValue123!"}')" = "400"
          secure -c "$JAR" -b "$JAR" -X PUT "$HTTPS/api/v1/admin/entra/" -H "X-CSRF-TOKEN: $T" -H 'Content-Type: application/json' -d '{"tenantId":"11111111-1111-1111-1111-111111111111","clientId":"22222222-2222-2222-2222-222222222222","clientSecret":"CiOnlyDummySecretValue123!"}'
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["enabled"] and d["tenantId"]=="11111111-1111-1111-1111-111111111111" and "clientSecret" not in d'
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | grep -vq "CiOnlyDummySecretValue123!"
          secure -c "$JAR" -b "$JAR" -X DELETE "$HTTPS/api/v1/admin/entra/" -H "X-CSRF-TOKEN: $T"
          secure -b "$JAR" "$HTTPS/api/v1/admin/entra/" | grep -q '"enabled":false'
          secure -c "$JAR" -b "$JAR" -X PUT "$HTTPS/api/v1/admin/secrets/ci.token" \
            -H "X-CSRF-TOKEN: $T" -H 'Content-Type: application/json' \
            -d '{"value":"CI_VALUE_ONLY"}'
          secure -b "$JAR" "$HTTPS/api/v1/admin/secrets/" | grep -q '"ci.token"'
          docker compose exec -T database psql -U plenaro -d plenaro -Atc \
            "SELECT ciphertext <> convert_to('CI_VALUE_ONLY', 'UTF8') FROM encrypted_secrets WHERE secret_name='ci.token'" | grep -qx 't'
