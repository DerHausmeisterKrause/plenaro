          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X DELETE "$API/api/v1/classic-import/batches/$V2_BATCH" -H "X-CSRF-TOKEN: $CSRF")" = "204"
          curl -fsS -b "$COOKIE" "$API/api/v1/classic-import/archive/overview" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert (d["metadataCount"],d["bookingCount"],d["monthlyCount"],d["settingsBatches"])==(0,0,0,0)'
